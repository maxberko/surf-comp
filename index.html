<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, max-age=0" />
    <title>PoyPoyo Surf</title>
    <link rel="canonical" href="./docs/" />
    <style>
      html, body { height: 100%; margin: 0; background: #0B1E2D; color: #EAF2F8;
        font-family: -apple-system, system-ui, sans-serif; }
      .wrap { height: 100%; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 12px; }
      a { color: #2FBFA0; font-weight: 800; text-decoration: none; font-size: 18px; }
    </style>
    <script>
      // Redirige vers l'app en cassant le cache du HTML à chaque visite, pour que
      // la dernière build soit toujours chargée (le bundle JS est hashé/immuable,
      // donc pas re-téléchargé inutilement).
      location.replace('./docs/?cb=' + Date.now() + location.hash);
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=./docs/" /></noscript>
  </head>
  <body>
    <div class="wrap">
      <div style="font-size:44px">🏄‍♂️</div>
      <a href="./docs/">Ouvrir PoyPoyo Surf →</a>
    </div>
  </body>
</html>
